<path d="M440 850H766L780 864V932H440Z" fill="#fffbe6" stroke="#222" stroke-width="1.2"/><path d="M766 850V864H780" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="450" y="872" text-anchor="start" font-size="12">Every FK to users (reviewed_by, resolved_by,</text>
<text x="450" y="889" text-anchor="start" font-size="12">scored_by, acknowledged_by, generated_by) is</text>
<text x="450" y="906" text-anchor="start" font-size="12">nullable and uses ON DELETE SET NULL, so</text>
<text x="450" y="923" text-anchor="start" font-size="12">deleting a user never deletes records.</text>
<path d="M440 960H766L780 974V1008H440Z" fill="#fffbe6" stroke="#222" stroke-width="1.2"/><path d="M766 960V974H780" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="450" y="982" text-anchor="start" font-size="12">Notation: one bar = exactly one, crow's foot =</text>
<text x="450" y="999" text-anchor="start" font-size="12">zero or more. 'null' marks a nullable column.</text>
<path d="M820 850H1146L1160 864V932H820Z" fill="#fffbe6" stroke="#222" stroke-width="1.2"/><path d="M1146 850V864H1160" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="830" y="872" text-anchor="start" font-size="12">Photos are files on disk under</text>
<text x="830" y="889" text-anchor="start" font-size="12">uploads/{report_id}/, not a column.</text>
<text x="830" y="906" text-anchor="start" font-size="12">enum types (cap_status_enum etc.) are</text>
<text x="830" y="923" text-anchor="start" font-size="12">PostgreSQL enumerated types.</text>
</svg>