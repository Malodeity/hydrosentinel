# Keeps the free Render API awake, so a visitor does not wait 30 to 60 seconds for it to start.
# It calls "/", which answers without touching the database, so the Neon database can still go to sleep and save its free compute hours.
# GitHub sometimes delays scheduled runs, so a second, independent monitor (UptimeRobot, every 5 minutes) should ping the same address.
name: keep-alive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the API and show how long it took
        run: |
          curl -fsS --max-time 90 --retry 3 --retry-delay 10 -o /dev/null \
            -w "status %{http_code} in %{time_total}s\n" \
            https://hydrosentinel-api-5h3u.onrender.com/
